name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Real-time refresh — triggered by tracked source repos (codwithyc/* /
  # yule-studio/*) on their push events via the `notify-hompage.yml`
  # workflow. Each source repo POSTs to /repos/yule-studio/hompage/dispatches
  # with event_type=github-data-refresh.
  repository_dispatch:
    types: [github-data-refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Generate GitHub stats
        run: npm run github:stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_STATS_USERNAME: codwithyc
      - name: Generate GitHub projects
        run: npm run github:projects
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PROJECTS_SOURCES: user:codwithyc,org:yule-studio
      - name: Generate GitHub languages
        run: npm run github:languages
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LANGUAGES_SOURCES: user:codwithyc,org:yule-studio
          GITHUB_LANGUAGES_EXCLUDE: yule-studio-agent
          # Surface every language that has any code. Default 0.5 hides Go/JS/
          # Shell/Go-Template when one repo (Python yule-studio-agent) dominates
          # by bytes. With 0.01 the user still sees the full skill surface.
          GITHUB_LANGUAGES_MIN_PERCENT: '0.01'
      - name: Generate GitHub topics
        run: npm run github:topics
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # Code search needs a PAT — Actions' github.token gets 429+HTML.
          # GH_STATS_TOKEN (fine-grained PAT) is the only one that works.
          GITHUB_TOPICS_SEARCH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOPICS_SOURCES: user:codwithyc,org:yule-studio
      - name: Sync Tistory blog (RSS + per-post view scrape)
        run: npm run blog:sync
        env:
          BLOG_URL: https://codingtips.tistory.com
      - run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
